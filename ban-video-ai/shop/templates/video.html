{% extends "base.html" %}
{% block title %}{{ video.title }}{% endblock %}
{% block content %}
<h1>{{ video.title }}</h1>
<p>Giá: <b>{{ video.price|vnd }}</b></p>
{% if video.preview_file %}
  <p>Xem thử:</p>
  <video src="{{ url_for('store.preview_file', filename=video.preview_file) }}" controls controlsList="nodownload" width="360"></video>
{% endif %}
{% if video.description %}<p>{{ video.description }}</p>{% endif %}
<form method="post" action="{{ url_for('store.buy', video_id=video.id) }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <button type="submit">Mua</button>
</form>
{% endblock %}
