<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shop video AI{% endblock %}</title>
</head>
<body>
  <p>
    <a href="{{ url_for('store.index') }}">Trang chủ</a>
    {% if session.get('is_admin') %}
      | <a href="{{ url_for('admin.dashboard') }}">Doanh thu</a>
      | <a href="{{ url_for('admin.videos') }}">Video</a>
      | <a href="{{ url_for('admin.orders') }}">Đơn hàng</a>
      | <a href="{{ url_for('admin.transactions') }}">Giao dịch</a>
      <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button type="submit">Đăng xuất</button>
      </form>
    {% endif %}
  </p>
  <hr>
  {% for message in get_flashed_messages() %}
    <p><b>{{ message }}</b></p>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
