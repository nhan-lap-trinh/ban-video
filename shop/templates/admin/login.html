{% extends "admin/base_admin.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="hop-dang-nhap">
  <h1>Đăng nhập</h1>
  {% if error %}<div class="thong-bao loi"><p>{{ error }}</p></div>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="o-nhap">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="off" required>
    </div>
    <div class="o-nhap">
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="nut-chinh nut-rong">Đăng nhập</button>
  </form>
</div>
{% endblock %}
