{% extends "admin/base_admin.html" %}
{% block title %}Đăng nhập quản lý{% endblock %}
{% block content %}
<h1>Đăng nhập quản lý</h1>
{% if error %}<p><b>{{ error }}</b></p>{% endif %}
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <p>Tên đăng nhập: <input name="username" autocomplete="username" required></p>
  <p>Mật khẩu: <input name="password" type="password" autocomplete="current-password" required></p>
  <button type="submit">Đăng nhập</button>
</form>
{% endblock %}
